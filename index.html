<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>SOS Guard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="rain"></canvas>
<div id="banner" hidden></div>
<div id="view"></div>
<div id="toast" hidden></div>
<input type="file" id="fi" hidden multiple accept=".txt,.json,text/plain,application/json">
<script>
function _err(m){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:6px;z-index:9999;font:12px monospace;direction:ltr';d.textContent=m;document.body.appendChild(d)}
window.onerror=function(m,s,l){_err(m+' @'+(s||'').split('/').pop()+':'+l)};
window.onunhandledrejection=function(e){_err('Promise: '+(e.reason&&e.reason.message||e.reason))};
</script>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
